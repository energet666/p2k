; Конфигурация px для p2k.
;
; Логин и пароль здесь не нужны. px авторизуется на корпоративном прокси
; по Kerberos (Negotiate), используя билет текущего сеанса пользователя,
; который выдаётся при входе в доменную учётную запись.
;
; Если username оставить пустым, а kerberos = 0, px передаёт авторизацию
; в GSS-API и берёт билет из системного кэша (KRB5CCNAME или
; default_ccache_name из /etc/krb5.conf).

[proxy]
; Корпоративный прокси. Указывайте полное доменное имя, а не IP-адрес:
; по нему Kerberos получает билет для службы HTTP/<имя прокси>.
server = proxy.ols.vniitf.ru:3128
pac =
listen = 127.0.0.1
port = 18080
gateway = 0
hostonly = 0
allow = 127.0.0.1
noproxy =
useragent =
username =
auth = NEGOTIATE
kerberos = 0

[client]
client_username =
client_auth = NONE
client_nosspi = 0

[settings]
workers = 1
threads = 32
idle = 30
socktimeout = 20.0
proxyreload = 60
foreground = 1
log = 0
